# Feature flags for the .agents protocol.
# Boolean flags default to true unless explicitly set otherwise below
# (`architecture_contract` is the current exception). Users can disable
# individual capabilities via environment variables with the
# AGENTS_FEATURE_<FLAG> prefix (environment overrides this file).
#
# Consumption: flags are classified by who consumes them. Flags marked
# [code] are read mechanically by the harness runner
# (`runner_validators.is_feature_enabled`); their compliance is mechanical.
# Flags and settings marked [declarative] are consumed by agents reading
# this file. An enabled [declarative] flag is a behavioral obligation: the
# consuming agent must read its value before the flow point where it
# conditions behavior and act on it there; ignoring it is a deviation that
# must be logged. Compliance is auditable by joining the active-flags entry
# in SESSION_LOG.md with the consumption declared in the produced artifacts.
# Dual flags ([code] + declarative) carry both obligations independently.

[features]
# [declarative] rubrics, knowledge_base — gate agent behavior (reviewer role,
# context_discoverer role) and items of the protocol health checklist
# (.agents/standards/runtime/PROTOCOL_HEALTH.md).
rubrics = true
knowledge_base = true
# [declarative] caveman — read by agents (caveman skill), not by harness code.
caveman = true

# Discovery subsystem (.agents/orchestrators/discovery/)
# [declarative] llm_discovery, discovery_orchestrator — read by discovery agents.
llm_discovery = true
discovery_orchestrator = true
# [declarative] integer settings for the discovery agents.
discovery_sample_size = 10
discovery_environment_ttl_hours = 6
discovery_project_ttl_hours = 24

# Technical practices
# [code] read by the H01/H05 semantic validators; also consumed declaratively
# by workers and by the protocol health checklist (standards presence).
tdd = true
srp = true
ocp = true
lsp = true
isp = true
dip = true
screaming_architecture = true
clean_architecture = true
dry = true
layered_architecture = true
grasp = true
ddd_tactical = true
ddd_strategic = true
architecture_contract = false

[health_check]
# Maximum age of the last successful protocol health verification before the
# System Agent re-applies the health checklist at session start. [declarative]
# applied by the agent per .agents/standards/runtime/PROTOCOL_HEALTH.md;
# overridable via the AGENTS_HEALTH_CHECK_TTL_HOURS environment variable.
ttl_hours = 24
