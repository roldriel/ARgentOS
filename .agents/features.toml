# Feature flags for the .agents protocol.
# All flags default to true. Users can disable individual capabilities via
# environment variables with the AGENTS_FEATURE_<FLAG> prefix.

[features]
decision_trees = true
rubrics = true
knowledge_base = true
caveman = true

# Discovery subsystem (plans/PLAN_DISCOVERY_ORCHESTRATOR_02_EXECUTION.md)
llm_discovery = true
discovery_orchestrator = true
discovery_sample_size = 10
discovery_environment_ttl_hours = 6
discovery_project_ttl_hours = 24

# Technical practices
tdd = true
srp = true
ocp = true
lsp = true
isp = true
dip = true
screaming_architecture = true
clean_architecture = true
dry = true
layered_architecture = true
grasp = true
ddd_tactical = true
ddd_strategic = true
architecture_contract = false

[health_check]
# Maximum age of the last successful health check before the orchestrator
# runs it automatically at session start.
ttl_hours = 24
