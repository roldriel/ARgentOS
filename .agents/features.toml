# Inert payload template for the ARgentOS feature flags.
#
# THIS FILE IS NOT ACTIVE CONFIGURATION.
# The only active adopter configuration is:
#     ARGENTOS_ROOT/features.toml      (= <project-root>/.argentos/features.toml)
# Nothing reads this payload copy as configuration: the runtime resolves flags
# from ARGENTOS_ROOT/features.toml, and the Orchestrator reads that same file.
# This file is retained as payload data — the flag catalog template that the
# adoption lifecycle materializes into ARGENTOS_ROOT/features.toml, and the
# target of historical plan citations. It must never be treated as the
# adopter's active configuration.
#
# Boolean flags default to true unless explicitly set otherwise below
# (`architecture_contract` is the current exception). Flags marked
# [declarative] create a behavioral obligation when the active configuration
# enables them. The canonical catalog and the override rules live in
# standards/INDEX.md (§Feature flags).

[features]
# [declarative] rubrics, knowledge_base — gate agent behavior (reviewer role,
# context_discoverer role) and items of the protocol health checklist
# (.agents/standards/runtime/PROTOCOL_HEALTH.md).
rubrics = true
knowledge_base = true
# [declarative] caveman — read by agents (caveman skill), not by harness code.
caveman = true

# Discovery subsystem (.agents/orchestrators/discovery/)
# [declarative] llm_discovery, discovery_orchestrator — read by discovery agents.
llm_discovery = true
discovery_orchestrator = true
# [declarative] discovery_require_consent — read by the core Orchestrator at
# discovery detection time (orchestrator.md §4.3); when enabled, automatic
# discovery needs explicit user consent; when disabled, the legacy automatic
# invocation applies.
discovery_require_consent = true
# [declarative] integer settings for the discovery agents.
discovery_sample_size = 10
discovery_sample_size_per_language = 50
# Context budget for discovery workers, in estimated tokens
# (unit per .agents/standards/context/BUDGET_MATERIALIZATION.md).
discovery_context_budget = 32000
discovery_environment_ttl_hours = 6
discovery_project_ttl_hours = 24

# Technical practices
# [declarative] resolved by the Orchestrator at H01/H05 gate evaluation; also
# consumed by workers and by the protocol health checklist (standards presence).
tdd = true
srp = true
ocp = true
lsp = true
isp = true
dip = true
screaming_architecture = true
clean_architecture = true
dry = true
layered_architecture = true
grasp = true
ddd_tactical = true
ddd_strategic = true
architecture_contract = false

[health_check]
# Maximum age of the last successful protocol health verification before the
# System Agent re-applies the health checklist at session start. [declarative]
# applied by the agent per .agents/standards/runtime/PROTOCOL_HEALTH.md;
# overridable via the AGENTS_HEALTH_CHECK_TTL_HOURS environment variable.
ttl_hours = 24
