[metadata]
trigger = "H04"
description = "Decision tree for execution plan validation failures"
version = "1.0"

[nodes.start]
condition = "plan_out_of_scope == true"

[nodes.start.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Plan is unsafe or out of scope."

[nodes.start.false]
next = "check_user_decisions"

[nodes.check_user_decisions]
condition = "plan_depends_on_user == true"

[nodes.check_user_decisions.true]
action = "NEEDS_CLARIFICATION"
reason = "Plan depends on unresolved user decisions."

[nodes.check_user_decisions.false]
next = "check_retry"

[nodes.check_retry]
condition = "retry_count >= 1"

[nodes.check_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Repeated failure after retry; route to generic recovery."

[nodes.check_retry.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RETRY_WORKER"
target_phase = "05-plan.md"
role = "planner"
reason = "Plan is incomplete but correctable; retry planner."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
