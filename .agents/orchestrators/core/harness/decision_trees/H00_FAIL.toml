[metadata]
trigger = "H00"
description = "Decision tree for task analysis validation failures"
version = "1.0"

[nodes.start]
condition = "artifact_exists == false"

[nodes.start.true]
action = "RETRY_WORKER"
target_phase = "00-analyze-task.md"
role = "task_analyst"
reason = "TASK_ANALYSIS.md is missing or incomplete; retry task analyst."

[nodes.start.false]
next = "check_profile"

[nodes.check_profile]
condition = "profile_valid == false"

[nodes.check_profile.true]
action = "RETRY_WORKER"
target_phase = "00-analyze-task.md"
role = "task_analyst"
reason = "TASK_ANALYSIS.md lacks a valid task profile (trivial|standard|complex) or its justification is incoherent; retry task analyst."

[nodes.check_profile.false]
next = "check_ambiguity"

[nodes.check_ambiguity]
condition = "request_is_ambiguous == true"

[nodes.check_ambiguity.true]
action = "NEEDS_CLARIFICATION"
reason = "Request is ambiguous or lacks critical information."

[nodes.check_ambiguity.false]
next = "check_retry"

[nodes.check_retry]
condition = "retry_count >= 1"

[nodes.check_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Repeated failure after retry; route to generic recovery."

[nodes.check_retry.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Task analysis validation failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
