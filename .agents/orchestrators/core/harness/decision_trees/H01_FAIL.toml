[metadata]
trigger = "H01"
description = "Decision tree for task specification validation failures"
version = "1.0"

[nodes.start]
condition = "artifact_exists == false"

[nodes.start.true]
action = "RETRY_WORKER"
target_phase = "02-build-task-specification.md"
role = "task_specification_writer"
reason = "TASK_SPECIFICATION.md is missing or incomplete; retry writer."

[nodes.start.false]
next = "check_ambiguity"

[nodes.check_ambiguity]
condition = "objective_is_ambiguous == true or scope_is_clear == false"

[nodes.check_ambiguity.true]
action = "NEEDS_CLARIFICATION"
reason = "Objective or scope is ambiguous; request clarification."

[nodes.check_ambiguity.false]
next = "check_retry"

[nodes.check_retry]
condition = "retry_count >= 1"

[nodes.check_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Repeated failure after retry; route to generic recovery."

[nodes.check_retry.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Task specification validation failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
