[metadata]
trigger = "H03"
description = "Decision tree for context validation report failures"
version = "1.0"

[nodes.start]
condition = "context_contradictory == true"

[nodes.start.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Context is contradictory or unresolvable."

[nodes.start.false]
next = "check_gaps"

[nodes.check_gaps]
condition = "gaps_actionable == true"

[nodes.check_gaps.true]
action = "RETRY_WORKER"
target_phase = "03-gather-context.md"
role = "context_gatherer"
reason = "Actionable context gaps found; retry context gatherer."

[nodes.check_gaps.false]
next = "check_user_specific"

[nodes.check_user_specific]
condition = "context_user_specific == true"

[nodes.check_user_specific.true]
action = "NEEDS_CLARIFICATION"
reason = "Gaps require user-specific information."

[nodes.check_user_specific.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Context validation failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
