[metadata]
trigger = "H05"
description = "Decision tree for execution completion validation failures"
version = "1.0"

[nodes.start]
condition = "project_unrecoverable == true"

[nodes.start.true]
action = "ABORT"
reason = "Project state is unrecoverable; abort session."

[nodes.start.false]
next = "check_blocked"

[nodes.check_blocked]
condition = "execution_blocked == true"

[nodes.check_blocked.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Execution blocked by unexpected issue."

[nodes.check_blocked.false]
next = "check_complete"

[nodes.check_complete]
condition = "execution_complete == false"

[nodes.check_complete.true]
action = "RETRY_WORKER"
target_phase = "06-execute.md"
role = "executor"
reason = "Some steps remain pending; retry executor."

[nodes.check_complete.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Execution validation failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
