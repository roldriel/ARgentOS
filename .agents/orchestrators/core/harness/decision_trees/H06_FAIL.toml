[metadata]
trigger = "H06"
description = "Decision tree for verification report validation failures"
version = "1.0"

[nodes.start]
condition = "task_fundamentally_unachievable == true"

[nodes.start.true]
action = "ABORT"
reason = "Task is fundamentally unachievable; abort session."

[nodes.start.false]
next = "check_user_decision"

[nodes.check_user_decision]
condition = "failures_require_user == true"

[nodes.check_user_decision.true]
action = "NEEDS_CLARIFICATION"
reason = "Failures require user decision to proceed."

[nodes.check_user_decision.false]
next = "check_fixable"

[nodes.check_fixable]
condition = "failures_fixable == true"

[nodes.check_fixable.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Verification failures can be corrected by replanning."

[nodes.check_fixable.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Verification failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
