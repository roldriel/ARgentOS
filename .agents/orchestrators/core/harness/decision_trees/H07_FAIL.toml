[metadata]
trigger = "H07"
description = "Decision tree for scope compliance validation failures"
version = "1.0"

[nodes.start]
condition = "scope_violation_severe == true"

[nodes.start.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Scope violation is severe or repeated."

[nodes.start.false]
next = "check_expansion"

[nodes.check_expansion]
condition = "scope_expansion_requested == true"

[nodes.check_expansion.true]
action = "NEEDS_CLARIFICATION"
reason = "User needs to approve scope expansion."

[nodes.check_expansion.false]
next = "check_compliant"

[nodes.check_compliant]
condition = "scope_compliant == false"

[nodes.check_compliant.true]
action = "RETRY_WORKER"
target_phase = "06-execute.md"
role = "executor"
reason = "Scope reported as not compliant; retry executor once with corrected scope. If the retry also fails, generic recovery will be used."

[nodes.check_compliant.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Scope compliance check failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
