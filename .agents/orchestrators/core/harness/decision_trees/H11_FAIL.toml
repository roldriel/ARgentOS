[metadata]
trigger = "H11"
description = "Decision tree for intent reflection validation failures"
version = "1.0"

[nodes.start]
condition = "artifact_exists == false"

[nodes.start.true]
action = "RETRY_WORKER"
target_phase = "01-confirm-intent.md"
role = "intent_reflector"
reason = "INTENT_REFLECTION.md is missing or incomplete; retry intent reflector."

[nodes.start.false]
next = "check_correction_cycle"

[nodes.check_correction_cycle]
condition = "correction_cycle_exceeded == true"

[nodes.check_correction_cycle.true]
action = "NEEDS_CLARIFICATION"
reason = "Maximum correction cycles reached; ask the user to reformulate the task from scratch."

[nodes.check_correction_cycle.false]
next = "check_user_response"

[nodes.check_user_response]
condition = "user_rejected == true or user_unclear == true"

[nodes.check_user_response.true]
action = "NEEDS_CLARIFICATION"
reason = "User rejected the reflected intent or the intent remains unclear; request clarification."

[nodes.check_user_response.false]
next = "check_retry"

[nodes.check_retry]
condition = "retry_count >= 1"

[nodes.check_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Repeated failure after retry; route to generic recovery."

[nodes.check_retry.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Intent reflection validation failed; falling back to generic recovery."
[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
