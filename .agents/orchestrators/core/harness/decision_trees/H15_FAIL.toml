[metadata]
trigger = "H15"
description = "Decision tree for delegation validity failures"
version = "1.0"

[nodes.start]
condition = "profile_unresolvable == true or input_artifact_missing == true or budget_incoherent == true"

[nodes.start.true]
next = "check_payload_retry"

[nodes.start.false]
next = "check_return_report"

[nodes.check_payload_retry]
condition = "retry_count >= 1"

[nodes.check_payload_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Delegation payload still invalid after one correction (unresolvable profile, missing input artifact, or incoherent budget); route to generic recovery."

[nodes.check_payload_retry.false]
action = "RETRY_WORKER"
target_phase = "06-execute.md"
role = "worker"
reason = "Delegation payload is invalid (F1 blocker); the Orchestrator corrects the profile, input artifact paths, or context_budget and re-delegates once. target_phase/role name the primary delegation point; apply to the phase actually delegated."

[nodes.check_return_report]
condition = "return_report_invalid == true"

[nodes.check_return_report.true]
next = "check_report_retry"

[nodes.check_return_report.false]
next = "fallback"

[nodes.check_report_retry]
condition = "retry_count >= 1"

[nodes.check_report_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Return report still invalid after one corrective re-invocation; route to generic recovery per the delegation contract retry rules."

[nodes.check_report_retry.false]
action = "RETRY_WORKER"
target_phase = "06-execute.md"
role = "worker"
reason = "Return report invalid (F1 blocker over the protected transition); re-invoke the Worker once with corrective instructions. target_phase/role name the primary delegation point; apply to the phase actually delegated."

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Delegation validity failure without a specific route; falling back to generic recovery."

[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "08-recovery.md"
reason = "Fallback false branch; route to generic recovery."
