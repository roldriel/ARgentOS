[metadata]
trigger = "D00"
description = "Decision tree for discovery init validation failures"
version = "1.0"

[nodes.start]
condition = "artifact_exists == false"

[nodes.start.true]
action = "RETRY_WORKER"
target_phase = "00-discovery-init.md"
role = "init_worker"
reason = "KB_DISCOVERY_REPORT.md is missing or incomplete; retry init_worker."

[nodes.start.false]
next = "check_missing_scope"

[nodes.check_missing_scope]
condition = "request_is_ambiguous == true"

[nodes.check_missing_scope.true]
action = "NEEDS_CLARIFICATION"
reason = "Discovery request is missing critical information (scope, target, or required inputs)."

[nodes.check_missing_scope.false]
next = "check_retry"

[nodes.check_retry]
condition = "retry_count >= 1"

[nodes.check_retry.true]
action = "RECOVERY_GENERIC"
target_phase = "00-discovery-init.md"
reason = "Repeated failure after retry; transition to discovery:DISCOVERY_FAILED and report to the core Orchestrator."

[nodes.check_retry.false]
next = "fallback"

[nodes.fallback]
condition = "true"

[nodes.fallback.true]
action = "RECOVERY_GENERIC"
target_phase = "00-discovery-init.md"
reason = "Discovery init validation failed; transition to discovery:DISCOVERY_FAILED and report to the core Orchestrator."

[nodes.fallback.false]
action = "RECOVERY_GENERIC"
target_phase = "00-discovery-init.md"
reason = "Fallback false branch; transition to discovery:DISCOVERY_FAILED and report to the core Orchestrator."
