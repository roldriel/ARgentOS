name: check-protocol

on:
  push:
    branches: [dev, master]
    paths:
      - "protocol/**"
      - "dev/**"
      - ".github/workflows/check-protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "dev/**"
      - ".github/workflows/check-protocol.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Protocol documentation invariants
        run: python dev/tools/check_protocol_invariants.py --payload protocol .
      - name: Protocol and tooling tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest protocol/.agents/harness/tests/ dev/runtime/tests/ dev/tools/tests/ -q
