name: check-protocol

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history is required, not an optimization. The lifecycle gates and
      # the dogfoods resolve Git *objects*, not just the working tree: C-2
      # resolves each plan's declared tree ids with
      # `git rev-parse --verify <sha>^{tree}` (an advisory GAP for every anchor
      # it cannot resolve), and the SAE dogfoods read the commits of an earlier
      # Change with `git log --grep`. The default shallow checkout
      # (`fetch-depth: 1`) makes both silently degrade on CI — C-2 reported
      # GAP=27 and the dogfoods reported "the plan-138 commits are not in
      # history" — while the same suites are green on a full local clone.
      # Providing the history keeps the checkers' contract intact; weakening
      # them instead would accept missing evidence as valid.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Protocol documentation invariants
        run: python tools/check_protocol_invariants.py --payload protocol .
      - name: Plan citations and structure
        run: |
          python tools/check_plan_citations.py
          python tools/check_plan_structure.py
      - name: Protocol and tooling tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q
      - name: Protocol taxonomy coherence
        run: python tools/check_taxonomy_coherence.py
      - name: Canonical invariants equivalence
        run: python tools/check_invariants_equivalence.py
      - name: Session artifacts and version state
        run: |
          python tools/check_version_state.py
          python tools/check_session_artifacts.py
      - name: Product harness regression tests
        run: python -m pytest protocol/.agents/harness/tests/ -q
