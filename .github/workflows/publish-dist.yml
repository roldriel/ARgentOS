# publish-dist — regenera la rama `dist` desde `master`.
#
# La rama `dist` es el unico punto de consumo de ARgentOS para proyectos
# adoptantes: contiene SOLO `.agents/` y `AGENTS.md` en su raiz.
# Nunca se edita a mano: este workflow la reemplaza con el contenido
# publicable de `master` en cada push que toque el payload fuente
# (`protocol/`). El payload fuente usa `_AGENTS.md` (entry file inerte en el
# repo de desarrollo); al publicar se renombra a `AGENTS.md`.
name: publish-dist

on:
  push:
    branches: [master]
    paths:
      - "protocol/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT fine-grained (repo ARgentOS, Contents: read/write) guardado
          # como secreto DIST_PUSH_TOKEN. Si no existe, cae al GITHUB_TOKEN
          # por defecto (alcanza mientras el repo no tenga rulesets activos).
          token: ${{ secrets.DIST_PUSH_TOKEN || github.token }}

      - name: Publish protocol payload (.agents + AGENTS.md) to dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE_SHA="$(git rev-parse --short HEAD)"

          # Contenido publicable desde el payload fuente (protocol/)
          TMP="$(mktemp -d)"
          cp -r protocol/.agents protocol/_AGENTS.md "$TMP/"
          mv "$TMP/_AGENTS.md" "$TMP/AGENTS.md"

          # Traer dist (debe existir; se crea una sola vez en el repo)
          git fetch origin dist:dist
          git checkout -q dist
          git rm -rf . -q

          cp -r "$TMP/.agents" "$TMP/AGENTS.md" .
          rm -rf "$TMP"
          git add -A

          if git diff --cached --quiet; then
            echo "dist ya esta al dia con master @ $SOURCE_SHA; nada que publicar."
            exit 0
          fi

          git commit -q -m "dist: publish from master @ $SOURCE_SHA"
          git push origin dist
          echo "dist publicada desde master @ $SOURCE_SHA"
